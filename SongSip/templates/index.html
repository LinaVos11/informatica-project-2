<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziek Project - Inloggen</title>
    <style>
        body {
            background-color: #1a0f11;
            color: #f4efe6;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        header h1 {
            color: #d4af37;
            font-size: 3.5rem;
            margin-bottom: 5px;
            font-weight: normal;
        }
        header p {
            color: #bfa89e;
            margin-top: 0;
            margin-bottom: 40px;
            font-size: 1.2rem;
        }
        #spotify-login-knop {
            display: inline-block;
            background-color: #1DB954;
            color: #ffffff;
            border: none;
            padding: 15px 35px;
            font-family: 'Georgia', serif;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        #spotify-login-knop:hover {
            background-color: #1ed760;
            box-shadow: 0px 0px 15px rgba(29, 185, 84, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <h1>Song sip</h1>
        <p>Ontdek elke dag een nieuw nummer op basis van uw stemming.</p>
        
        <button id="spotify-login-knop">
            LOG IN MET SPOTIFY
        </button>
    </header>

    <script>
        const loginKnop = document.getElementById('spotify-login-knop');
        
        loginKnop.addEventListener('click', function() {
            // Voor nu sturen we de gebruiker handmatig door naar de main.html pagina.
            // Straks gaat hier de echte Spotify inlog-koppeling tussen zitten!
            window.location.href = 'main.html';
        });
    </script>

</body>
</html>
