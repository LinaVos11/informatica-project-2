<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muziek Project - Inloggen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='songsip.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <!-- Connectie met Google Fonts voor titel font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
</head>
<body>

    <header class="login-header">
        <h1 id="Dehoofdtitel">Song sip</h1>
        <p>Ontdek elke dag een nieuw nummer op basis van uw stemming.</p>
        
        <button id="spotify-login-knop">
            LOG IN MET SPOTIFY
        </button>
    </header>

    <footer class="site-footer">
        <p class="site-footer-name">SongSip</p>
        <p>Made by Pam, Sara, Lina, Stephanie and Mirthe</p>
    </footer>

    <script>
        const loginKnop = document.getElementById('spotify-login-knop');
        
        loginKnop.addEventListener('click', function() {
            // Voor nu sturen we de gebruiker handmatig door naar de startpagina.
            // Straks gaat hier de echte Spotify inlog-koppeling tussen zitten!
            window.location.href = "{{ url_for('home') }}";
        });
    </script>

</body>
</html>
