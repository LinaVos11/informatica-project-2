<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songsip - Ontdek nieuwe muziek!</title>
    <!-- Connectie met Google Fonts voor titel font-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='songsip.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>
    {% include "_navigation.html" %}

    <main>
        <section id="genre-kiezer">
            <h2>Waar heb je vandaag zin in?</h2>

            <label for="genres">Kies een muziekcategorie:</label>
            <select id="genres">
                <option value="rock-metal">Rock en metal</option>
                <option value="pop-indie">Pop en indie</option>
                <option value="asian">Asian</option>
                <option value="electronic-dance">Elektronisch en dance</option>
                <option value="hip-hop-rnb">Hip-hop en R&amp;B</option>
                <option value="jazz-blues-funk-soul">Jazz, blues, funk en soul</option>
                <option value="folk-country-acoustic">Folk, country en akoestisch</option>
                <option value="latin-south-america">Latin en Zuid-Amerikaans</option>
                <option value="reggae-afro-caribbean">Reggae en ritmes uit Afrika en het Caribisch gebied</option>
                <option value="regional-international">Regionaal en internationaal</option>
                <option value="classical-instrumental">Klassiek en instrumentaal</option>
                <option value="mood-activities-other">Sfeer, activiteiten en overige</option>
                <option value="random">Willekeurig</option>
            </select>

            <br><br>
            <button id="ontdek-knop">
                Verras me!
            </button>
        </section>

        <section id="resultaat">
            <h3>Jouw nummer voor vandaag:</h3>
            <div id="muziek-box">
                <p>Aan het laden...</p>
            </div>
        </section>
    </main>

    <script>
        const ontdekKnop = document.getElementById('ontdek-knop');
        const genreSelect = document.getElementById('genres');
        const resultaatSectie = document.getElementById('resultaat');
        const muziekBox = document.getElementById('muziek-box');

        ontdekKnop.addEventListener('click', function() {
            const gekozenGenre = genreSelect.value;
            resultaatSectie.style.display = 'block';
            const gekozenCategorie = genreSelect.options[genreSelect.selectedIndex].textContent;
            muziekBox.innerHTML = '<p>Er wordt gezocht in ' + gekozenCategorie + '...</p>';

            fetch('/api/songs?genre=' + encodeURIComponent(gekozenGenre))
                .then(function(response) {
                    return response.json().then(function(data) {
                        if (!response.ok) {
                            throw new Error(data.error || 'Nummers konden niet worden geladen.');
                        }
                        return data;
                    });
                })
                
                .then(function(data) {
                    const song = data.song;

                    muziekBox.innerHTML = `
                        <p>${data.personalized
                            ? 'Aanbevolen op basis van je opgeslagen nummers en recent afgespeelde muziek.'
                            : 'Dit nummer is willekeurig gekozen.'}
                        </p>
                        
                        ${song.album_image_url ? `
                            <img
                                src="${song.album_image_url}"
                                alt="Albumcover van ${song.track_name}"
                                class="album-cover"
                                style="width: 300px; height: 300px; object-fit: cover;"
                            >
                        ` : ''}
                        <h4>${song.track_name}</h4>
                        <p><strong>Artiest:</strong> ${song.artists}</p>
                        <p><strong>Album:</strong> ${song.album_name}</p>
                        <p><strong>Genre:</strong> ${song.track_genre}</p>
                        <p><strong>Populariteit:</strong> ${song.popularity}</p>

                        <p>
                            <a
                                href="https://open.spotify.com/track/${encodeURIComponent(song.track_id)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                🎧 Luister op Spotify
                            </a>
                        </p>        

                        <div class="song-feedback">
                            <h4>Wat vind je van dit nummer?</h4>

                            <button id="like-knop" type="button">
                                👍 Like
                            </button>

                            <button id="dislike-knop" type="button">
                                👎 Dislike
                            </button>

                            <p id="feedback-bericht" aria-live="polite"></p>
                        </div>
                    `;

                    function beoordeelNummer(rating) {
                        const bericht = document.getElementById('feedback-bericht');
                        const likeKnop = document.getElementById('like-knop');
                        const dislikeKnop = document.getElementById('dislike-knop');

                        likeKnop.disabled = true;
                        dislikeKnop.disabled = true;
                        bericht.textContent = 'Beoordeling opslaan...';

                        fetch('/api/rating', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                track_id: song.track_id,
                                rating: rating
                            })
                        })
                        .then(function(response) {
                            return response.json().then(function(data) {
                                if (!response.ok) {
                                    throw new Error(
                                        data.error || 'Opslaan is niet gelukt.'
                                    );
                                }
                                return data;
                            });
                        })
                        .then(function() {
                            bericht.textContent = rating === 1
                                ? 'Je vindt dit nummer leuk! 👍'
                                : 'Je vindt dit nummer niet leuk. 👎';

                            likeKnop.disabled = false;
                            dislikeKnop.disabled = false;
                        })
                        .catch(function(error) {
                            bericht.textContent = error.message;

                            likeKnop.disabled = false;
                            dislikeKnop.disabled = false;
                        });
                    }

                    document.getElementById('like-knop').addEventListener(
                        'click',
                        function() {
                            beoordeelNummer(1);
                        }
                    );

                    document.getElementById('dislike-knop').addEventListener(
                        'click',
                        function() {
                            beoordeelNummer(-1);
                        }
                    );
                })

                .catch(function(error) {
                    console.error(error);
                    muziekBox.textContent = error.message || 'Er is iets misgegaan bij het ophalen van het nummer.';
                });
        });
    </script>

    <footer class="site-footer">
        <p class="site-footer-name">SongSip</p>
        <p>Made by Pam, Sara, Lina, Stephanie and Mirthe</p>
    </footer>
</body>
</html>
