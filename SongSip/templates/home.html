<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songsip - Ontdek nieuwe muziek!</title>
<link rel="stylesheet" href="{{ url_for('static', filename='songsip.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>
    <div class="blijvendebalk">
        <header>
            <img id="balk" src="{{ url_for('static', filename='images/bordeauxrood.png') }}" alt="Bordeaux rood balk">
            <h1 id="Dehoofdtitel">
                <a href="{{ url_for('index') }}">Songsip</a>
            </h1>
        </header>
        <nav>
            <div class="dropdown">
                <button class="dropbtn">Menu</button>
                <div class="dropdown-content">
                    <a href="{{ url_for('index') }}">Home</a>
                    <a href="{{ url_for('about') }}">Why Songsip?</a>
                    <a href="{{ url_for('dailysong') }}">Song of the Day</a>
                    <a href="{{ url_for('history') }}">My songs</a>
                </div>
            </div>
        </nav>
    </div>

    <main>
        <section id="genre-kiezer">
            <h2>Waar heb je vandaag zin in?</h2>

            <label for="genres">Kies een genre:</label>
            <select id="genres">
                <option value="rock"> Rock</option>
                <option value="pop"> Pop</option>
                <option value="techno"> Techno</option>
                <option value="hiphop"> Hip Hop</option>
                <option value="jazz"> Jazz</option>
            </select>

            <br><br>
            <button id="ontdek-knop">
                Verras me!
            </button>
        </section>

        <section id="resultaat">
            <h3>Jouw nummer voor vandaag:</h3>
            <div id="muziek-box">
                <p>Aan het laden...</p>
            </div>
        </section>
    </main>

    <script>
        const ontdekKnop = document.getElementById('ontdek-knop');
        const genreSelect = document.getElementById('genres');
        const resultaatSectie = document.getElementById('resultaat');
        const muziekBox = document.getElementById('muziek-box');

        ontdekKnop.addEventListener('click', function() {
            const gekozenGenre = genreSelect.value;
            resultaatSectie.style.display = 'block';
            muziekBox.innerHTML = '<p>Er wordt gezocht naar een ' + gekozenGenre + ' nummer...</p>';
        });
    </script>

</body>
</html>
