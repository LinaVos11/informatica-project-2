<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SongSip - Discover new music!</title>
    <!-- Load the Monoton font used for the title. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='songsip.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>
    {% include "_navigation.html" %}

    <main>
        <section id="genre-kiezer">
            <h2>What are you in the mood for today?</h2>

            <label for="genres">Choose a music category:</label>
            <select id="genres">
                <option value="rock-metal">Rock and metal</option>
                <option value="pop-indie">Pop and indie</option>
                <option value="asian">Asian</option>
                <option value="electronic-dance">Electronic and dance</option>
                <option value="hip-hop-rnb">Hip-hop and R&amp;B</option>
                <option value="jazz-blues-funk-soul">Jazz, blues, funk and soul</option>
                <option value="folk-country-acoustic">Folk, country and acoustic</option>
                <option value="latin-south-america">Latin and South America</option>
                <option value="reggae-afro-caribbean">Reggae and rhythms from Africa and the Caribbean</option>
                <option value="regional-international">Regional and international</option>
                <option value="classical-instrumental">Classical and instrumental</option>
                <option value="mood-activities-other">Moods, activities and other</option>
                <option value="random">Random</option>
            </select>

            <br><br>
            <button id="ontdek-knop" type="button">
                Surprise me!
            </button>
        </section>

        <section id="resultaat">
            <h3>Your song for today:</h3>
            <div id="muziek-box">
                <p>Loading...</p>
            </div>
        </section>
    </main>

    <script>
        const ontdekKnop = document.getElementById('ontdek-knop');
        const genreSelect = document.getElementById('genres');
        const resultaatSectie = document.getElementById('resultaat');
        const muziekBox = document.getElementById('muziek-box');

        ontdekKnop.addEventListener('click', function() {
            const selectedGenre = genreSelect.value;
            resultaatSectie.style.display = 'block';
            const selectedCategory = genreSelect.options[genreSelect.selectedIndex].textContent;
            muziekBox.innerHTML = '<p>Searching ' + selectedCategory + '...</p>';

            fetch('/api/songs?genre=' + encodeURIComponent(selectedGenre))
                .then(function(response) {
                    return response.json().then(function(data) {
                        if (!response.ok) {
                            throw new Error(data.error || 'Songs could not be loaded.');
                        }
                        return data;
                    });
                })
                
                .then(function(data) {
                    const song = data.song;

                    muziekBox.innerHTML = `
                        <p>${data.personalized
                            ? 'Recommended based on your saved tracks and recently played music.'
                            : 'This song was chosen at random.'}
                        </p>
                        
                        ${song.album_image_url ? `
                            <img
                                src="${song.album_image_url}"
                                alt="Album cover for ${song.track_name}"
                                class="album-cover"
                                style="width: 300px; height: 300px; object-fit: cover;"
                            >
                        ` : ''}
                        <h4>${song.track_name}</h4>
                        <p><strong>Artist:</strong> ${song.artists}</p>
                        <p><strong>Album:</strong> ${song.album_name}</p>
                        <p><strong>Genre:</strong> ${song.track_genre}</p>
                        <p><strong>Popularity:</strong> ${song.popularity}</p>

                        <p>
                            <a
                                href="https://open.spotify.com/track/${encodeURIComponent(song.track_id)}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                🎧 Listen on Spotify
                            </a>
                        </p>        

                        <div class="song-feedback">
                            <h4>What do you think of this song?</h4>

                            <button id="like-knop" type="button">
                                👍 Like
                            </button>

                            <button id="dislike-knop" type="button">
                                👎 Dislike
                            </button>

                            <p id="feedback-bericht" aria-live="polite"></p>
                        </div>
                    `;

                    function beoordeelNummer(rating) {
                        const bericht = document.getElementById('feedback-bericht');
                        const likeKnop = document.getElementById('like-knop');
                        const dislikeKnop = document.getElementById('dislike-knop');

                        likeKnop.disabled = true;
                        dislikeKnop.disabled = true;
                        bericht.textContent = 'Saving your rating...';

                        fetch('/api/rating', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                track_id: song.track_id,
                                rating: rating
                            })
                        })
                        .then(function(response) {
                            return response.json().then(function(data) {
                                if (!response.ok) {
                                    throw new Error(
                                        data.error || 'Could not save your rating.'
                                    );
                                }
                                return data;
                            });
                        })
                        .then(function() {
                            bericht.textContent = rating === 1
                                ? 'You liked this song! 👍'
                                : 'You disliked this song. 👎';

                            likeKnop.disabled = false;
                            dislikeKnop.disabled = false;
                        })
                        .catch(function(error) {
                            bericht.textContent = error.message;

                            likeKnop.disabled = false;
                            dislikeKnop.disabled = false;
                        });
                    }

                    document.getElementById('like-knop').addEventListener(
                        'click',
                        function() {
                            beoordeelNummer(1);
                        }
                    );

                    document.getElementById('dislike-knop').addEventListener(
                        'click',
                        function() {
                            beoordeelNummer(-1);
                        }
                    );
                })

                .catch(function(error) {
                    console.error(error);
                    muziekBox.textContent = error.message || 'Something went wrong while loading the song.';
                });
        });
    </script>

    <footer class="site-footer">
        <p class="site-footer-name">SongSip</p>
        <p>Made by Pam, Sara, Lina, Stephanie and Mirthe</p>
    </footer>
</body>
</html>
